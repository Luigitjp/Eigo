<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="えいご練習">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>えいご練習</title>
<style>
:root{--sky:#e8f1f6;--wall:#efe9df;--floor:#d9cfc0;--wood:#b98a5a;--box:#d7b27c;--boxs:#b58d56;--metal:#8a9199;--dark:#4a4f57;--c1:#5b8db8;--c2:#c86b5a;--c3:#6aa36f;--glass:#cfe3ee;--deep:#2b2e33;--cloth:#ffffff;--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e3e1db;--acc:#2f6f5e;--ok:#2f8f5b;--ng:#c8463d;--okbg:#e6f4ec;--ngbg:#fbeae8}
@media (prefers-color-scheme:dark){:root{--sky:#1d2a33;--wall:#2a2723;--floor:#3a342c;--wood:#8a6a48;--box:#a8895c;--boxs:#7d6440;--metal:#6f767e;--dark:#c9ced4;--c1:#6f9cc4;--c2:#c97e70;--c3:#76ad7a;--glass:#2f4552;--deep:#0e0f11;--cloth:#d9d4cc;--bg:#141414;--card:#1f1f1f;--ink:#f2f2f2;--sub:#9a9a9f;--line:#333;--acc:#6cc3a8;--ok:#5fcf8e;--ng:#ff7a70;--okbg:#17301f;--ngbg:#3a1c1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.menu{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.menu b{display:block;font-size:18px;margin-bottom:4px}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.back{background:none;border:none;color:var(--acc);font:inherit;font-size:16px;padding:8px 0;cursor:pointer}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.ng{background:var(--ng)}.dot.cur{background:var(--acc)}
.prompt{color:var(--sub);font-size:14px;margin-top:28px;text-align:center}
.word{font-size:34px;font-weight:700;text-align:center;margin:10px 0 6px;letter-spacing:.5px;word-break:break-word}
.tag{display:inline-block;font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:2px 8px}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:19px;padding:18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opts.four{grid-template-columns:1fr 1fr;gap:10px}
.opts.four .opt{padding:14px 8px;font-size:17px}
.btn{font:inherit;font-size:17px;font-weight:600;width:100%;padding:16px;border-radius:14px;border:none;background:var(--acc);color:#fff;cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.row{display:flex;gap:10px}.row .btn{margin-top:0}
.play{width:48px;height:48px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:18px;padding:0 0 0 3px;cursor:pointer}
.ans{display:block;width:100%;font:inherit;font-size:18px;line-height:1.5;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:14px;min-height:120px;resize:none;overflow:hidden}
.res{line-height:1.9;font-size:18px}
.w-ok{color:var(--ok)}.w-ng{color:var(--ng);text-decoration:underline}
.ja{color:var(--sub);font-size:14px;margin-top:6px}
.list div{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.list div:last-child{border:none}
.list div div{padding:0;border-bottom:none}
.score{font-size:40px;font-weight:700;text-align:center;margin:10px 0 0}
.hide{display:none}
.tr{display:block;font-size:13px;color:var(--sub);margin-top:4px;font-weight:400}
.chk{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--acc);margin:0;flex:none}
.srow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.srow:last-child{border:none}
.lvmsg{text-align:center;font-size:15px;color:var(--acc);margin-top:8px}
.stg{width:100%;background:none;border:none;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;text-align:left}.stg:last-child{border-bottom:none}
.blank{display:inline-block;min-width:72px;border-bottom:2px solid var(--ink);vertical-align:-2px}
.qbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0 4px}.qbar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left;transition:transform .1s linear}.qbar.low i{background:var(--ng)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-top:16px}.seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font:inherit;font-size:15px;color:var(--sub);cursor:pointer}.seg .on{background:var(--card);color:var(--ink);font-weight:600}
.grp{display:flex;width:100%;align-items:center;background:none;border:none;padding:0;font:inherit;font-size:16px;color:inherit;cursor:pointer;text-align:left}
.grid{width:100%;border-collapse:collapse;text-align:center;font-size:15px}.grid th,.grid td{padding:9px 2px;border-bottom:1px solid var(--line)}.grid th{font-weight:600;font-size:13px;color:var(--sub)}.grid tr:first-child th{font-size:12px}.grid .tot td,.grid .tot th{border-bottom:none;font-weight:700}
.calv{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--card);color:var(--acc);border:1.5px solid var(--acc);font-size:10px;font-weight:700;line-height:14px;padding:0 3px}
.calday{cursor:pointer}
.w-half{color:var(--acc)}.dot.half{background:linear-gradient(90deg,var(--ok) 50%,var(--ng) 50%)}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.tbar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .1s linear}
.woarea{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;margin-top:12px;border-radius:14px;border:1.5px dashed var(--line);align-content:flex-start}
.woarea.pool{border:none;padding:4px 0}
.chip{font:inherit;font-size:17px;padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.ng{border-color:var(--ng);background:var(--ngbg)}.chip.ok{border-color:var(--ok);background:var(--okbg)}
.mmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mmc{position:relative;height:84px;border-radius:14px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-size:15px;line-height:1.3;padding:6px;cursor:pointer;word-break:break-word}
.mmc span{visibility:hidden}.mmc::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--card);opacity:.8}
.mmc.up,.mmc.done{background:var(--card);color:var(--ink);border-color:var(--line)}.mmc.up span,.mmc.done span{visibility:visible}.mmc.up::after,.mmc.done::after{content:none}
.mmc.done{border-color:var(--ok);background:var(--okbg)}.mmc.ng{border-color:var(--ng);background:var(--ngbg)}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gtile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 14px;min-height:84px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.gtile b{font-size:16px}.gtile span{font-size:12px;color:var(--sub);line-height:1.4}
.hero{background:var(--acc);border-color:var(--acc);color:#fff;padding:22px 20px}
@media (prefers-color-scheme:dark){.hero{color:#10231d}}
.hero.off{background:var(--card);border-color:var(--line);color:var(--sub);cursor:default}
.menu .bar{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.menu .bar i{display:block;height:100%;background:var(--acc)}
.dictbtn{display:flex;align-items:center;gap:10px;padding:14px 18px;margin-top:10px}.dictbtn b{display:inline;font-size:16px;margin:0}.dictbtn .sub{margin-left:auto}
.dsec{font-size:12px;color:var(--sub);font-weight:600;margin-top:14px;margin-bottom:4px}
.dline{font-size:15px;line-height:1.6;padding:3px 0}
.prob{border-top:1px solid var(--line);padding:10px 0}.prob:first-of-type{margin-top:6px}
.prob summary{cursor:pointer;line-height:1.6;font-size:15px}.prob .ja{margin-top:6px}
.hl{color:var(--acc)}
.gtitle{font-weight:700;text-align:center;margin-bottom:8px;letter-spacing:.3px}
table.gt{width:100%;border-collapse:collapse;font-size:15px}
table.gt th,table.gt td{border:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.gt th{background:var(--bg);font-size:13px}
.gnote{font-size:13px;margin-top:8px;line-height:1.5}
.pic{width:100%;display:block;border-radius:10px;background:var(--sky)}
.note{font-size:12px;color:var(--sub);margin-top:18px;line-height:1.6}
</style>
</head>

/* ---- イラスト（写真描写・Part 1 風） ----
   絵は SVG を部品の関数で組み立てる。色は CSS 変数なのでダークモードでも同じ絵になる。
   方針：人は描かず、「物の状態・位置・並び方」で答えが1つに決まる場面だけにする */
const IV=k=>`var(--${k})`;
const IL={
  // 部屋（奥の壁＋奥行きのある床）。wy＝壁と床の境目
  room(wy=110){return `<rect width="320" height="${wy}" fill="${IV("wall")}"/><polygon points="0,${wy} 320,${wy} 320,210 0,210" fill="${IV("floor")}"/>
    <line x1="0" y1="${wy}" x2="320" y2="${wy}" stroke="${IV("boxs")}" stroke-width="3"/>
    ${[-240,-120,0,120,240].map(d=>`<line x1="${160+d*0.25}" y1="${wy}" x2="${160+d*1.3}" y2="210" stroke="${IV("boxs")}" stroke-width="1" opacity=".3"/>`).join("")}
    <line x1="0" y1="${wy+(210-wy)*0.45}" x2="320" y2="${wy+(210-wy)*0.45}" stroke="${IV("boxs")}" stroke-width="1" opacity=".25"/>`},
  // 屋外（空＋地面）。gy＝地平線
  outside(gy=120){return `<rect width="320" height="${gy}" fill="${IV("sky")}"/><rect y="${gy}" width="320" height="${210-gy}" fill="${IV("floor")}"/>
    <line x1="0" y1="${gy}" x2="320" y2="${gy}" stroke="${IV("boxs")}" stroke-width="2"/>`},
  // 立体の箱。前面の左上 (x,y)、幅 w、高さ h、奥行き d
  cube(x,y,w=46,h=36,d=10){const e=d*0.8;return `<g><polygon points="${x+w},${y} ${x+w+d},${y-e} ${x+w+d},${y+h-e} ${x+w},${y+h}" fill="${IV("boxs")}"/>
    <polygon points="${x},${y} ${x+d},${y-e} ${x+w+d},${y-e} ${x+w},${y}" fill="${IV("box")}" stroke="${IV("boxs")}" stroke-width="1.2"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${IV("box")}" stroke="${IV("boxs")}" stroke-width="1.5"/><rect x="${x+w/2-5}" y="${y}" width="10" height="${Math.min(10,h/3)}" fill="${IV("boxs")}" opacity=".45"/></g>`},
  // 後ろから見た椅子
  chairBack(cx,yb,s=1){const w=34*s,bh=24*s,sh=6*s,lg=16*s,x=cx-w/2,t=yb-lg-sh-bh;
    return `<g><rect x="${x}" y="${t}" width="${w}" height="${bh}" rx="${3*s}" fill="${IV("wood")}" stroke="${IV("boxs")}"/><rect x="${x-2*s}" y="${yb-lg-sh}" width="${w+4*s}" height="${sh}" rx="${2*s}" fill="${IV("wood")}" opacity=".85"/>
    <line x1="${x+3*s}" y1="${yb-lg}" x2="${x+3*s}" y2="${yb}" stroke="${IV("dark")}" stroke-width="${2*s}"/><line x1="${x+w-3*s}" y1="${yb-lg}" x2="${x+w-3*s}" y2="${yb}" stroke="${IV("dark")}" stroke-width="${2*s}"/></g>`},
  // 正面から見た椅子（座面が見える。積み重ね用）
  chairFront(cx,yb,s=1){const w=40*s,x=cx-w/2;return `<g><rect x="${x+3*s}" y="${yb-58*s}" width="${w-6*s}" height="${22*s}" rx="${4*s}" fill="${IV("c1")}" stroke="${IV("dark")}" stroke-width="1"/>
    <path d="M${x} ${yb-26*s} L${x+w} ${yb-26*s} L${x+w-3*s} ${yb-20*s} L${x+3*s} ${yb-20*s} Z" fill="${IV("c1")}" stroke="${IV("dark")}" stroke-width="1"/>
    <line x1="${x+4*s}" y1="${yb-36*s}" x2="${x+4*s}" y2="${yb}" stroke="${IV("dark")}" stroke-width="${2.5*s}"/><line x1="${x+w-4*s}" y1="${yb-36*s}" x2="${x+w-4*s}" y2="${yb}" stroke="${IV("dark")}" stroke-width="${2.5*s}"/></g>`},
  // 横から見た椅子（f=-1 で左向き）
  chairSide(x,yb,s=1,f=1){const p=(dx,dy)=>`${x+dx*s*f},${yb+dy*s}`;
    return `<path d="M${p(0,0)} L${p(0,-22)} L${p(26,-22)} L${p(26,0)} M${p(-2,-22)} L${p(28,-22)} M${p(26,-22)} L${p(28,-50)}" fill="none" stroke="${IV("wood")}" stroke-width="${4*s}" stroke-linecap="round"/>`},
  table(x,yb,w=90,h=40,cloth=false){return `<rect x="${x}" y="${yb-h}" width="${w}" height="6" rx="2" fill="${IV("wood")}"/>
    <line x1="${x+6}" y1="${yb-h+6}" x2="${x+6}" y2="${yb}" stroke="${IV("boxs")}" stroke-width="3"/><line x1="${x+w-6}" y1="${yb-h+6}" x2="${x+w-6}" y2="${yb}" stroke="${IV("boxs")}" stroke-width="3"/>
    ${cloth?`<path d="M${x-6},${yb-h-1} L${x+w+6},${yb-h-1} L${x+w+10},${yb-h+26} Q${x+w/2},${yb-h+34} ${x-10},${yb-h+26} Z" fill="${IV("cloth")}" stroke="${IV("metal")}" stroke-width="1.5"/>`:""}`},
  shelf(x,y,w,h,n=3){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${IV("wood")}" stroke-width="4"/>`;for(let i=1;i<n;i++)s+=`<line x1="${x}" y1="${y+h*i/n}" x2="${x+w}" y2="${y+h*i/n}" stroke="${IV("wood")}" stroke-width="4"/>`;return s},
  books(x,yb,hs,cols=["c1","c2","c3","wood"]){let s="",cx=x;hs.forEach((h,i)=>{s+=`<rect x="${cx}" y="${yb-h}" width="9" height="${h}" fill="${IV(cols[i%cols.length])}" stroke="${IV("dark")}" stroke-width=".6"/>`;cx+=10});return s},
  plant(cx,yb,s=1){return `<ellipse cx="${cx}" cy="${yb-22*s}" rx="${14*s}" ry="${12*s}" fill="${IV("c3")}"/><ellipse cx="${cx-8*s}" cy="${yb-28*s}" rx="${8*s}" ry="${7*s}" fill="${IV("c3")}"/><ellipse cx="${cx+8*s}" cy="${yb-30*s}" rx="${8*s}" ry="${7*s}" fill="${IV("c3")}"/>
    <polygon points="${cx-10*s},${yb-14*s} ${cx+10*s},${yb-14*s} ${cx+7*s},${yb} ${cx-7*s},${yb}" fill="${IV("c2")}"/>`},
  car(x,yb,s=1,c="c1"){const P=(a,b)=>`${x+a*s},${yb+b*s}`;
    return `<g><path d="M${P(0,-10)} L${P(0,-24)} L${P(14,-26)} L${P(26,-42)} L${P(66,-42)} L${P(80,-26)} L${P(96,-24)} L${P(96,-10)} Z" fill="${IV(c)}" stroke="${IV("dark")}" stroke-width="1.5"/>
    <path d="M${P(30,-38)} L${P(46,-38)} L${P(46,-27)} L${P(22,-27)} Z M${P(50,-38)} L${P(64,-38)} L${P(74,-27)} L${P(50,-27)} Z" fill="${IV("glass")}"/>
    <circle cx="${x+22*s}" cy="${yb-8*s}" r="${9*s}" fill="${IV("deep")}"/><circle cx="${x+76*s}" cy="${yb-8*s}" r="${9*s}" fill="${IV("deep")}"/></g>`},
  // 正面から見た車（駐車場の並び用）
  carFront(cx,yb,s=1,c="c1"){const w=54*s,h=34*s,x=cx-w/2;return `<g><rect x="${x}" y="${yb-h}" width="${w}" height="${h*0.62}" rx="${6*s}" fill="${IV(c)}" stroke="${IV("dark")}" stroke-width="1.2"/>
    <path d="M${x+8*s},${yb-h} L${x+14*s},${yb-h-14*s} L${x+w-14*s},${yb-h-14*s} L${x+w-8*s},${yb-h} Z" fill="${IV(c)}" stroke="${IV("dark")}" stroke-width="1.2"/>
    <path d="M${x+14*s},${yb-h-2*s} L${x+17*s},${yb-h-11*s} L${x+w-17*s},${yb-h-11*s} L${x+w-14*s},${yb-h-2*s} Z" fill="${IV("glass")}"/>
    <rect x="${x+4*s}" y="${yb-h*0.38}" width="${8*s}" height="${h*0.38}" fill="${IV("deep")}"/><rect x="${x+w-12*s}" y="${yb-h*0.38}" width="${8*s}" height="${h*0.38}" fill="${IV("deep")}"/>
    <circle cx="${x+10*s}" cy="${yb-h*0.72}" r="${3*s}" fill="${IV("card")}"/><circle cx="${x+w-10*s}" cy="${yb-h*0.72}" r="${3*s}" fill="${IV("card")}"/></g>`},
  ladder(xb,yb,xt,yt,n=6){const dx=13;let s=`<line x1="${xb}" y1="${yb}" x2="${xt}" y2="${yt}" stroke="${IV("metal")}" stroke-width="4"/><line x1="${xb+dx}" y1="${yb}" x2="${xt+dx}" y2="${yt}" stroke="${IV("metal")}" stroke-width="4"/>`;
    for(let i=1;i<n;i++){const t=i/n,x=xb+(xt-xb)*t,y=yb+(yt-yb)*t;s+=`<line x1="${x}" y1="${y}" x2="${x+dx}" y2="${y}" stroke="${IV("metal")}" stroke-width="3"/>`}return s},
  tree(cx,yb,s=1){return `<rect x="${cx-5*s}" y="${yb-50*s}" width="${10*s}" height="${50*s}" fill="${IV("wood")}"/><circle cx="${cx}" cy="${yb-68*s}" r="${34*s}" fill="${IV("c3")}"/><circle cx="${cx-24*s}" cy="${yb-54*s}" r="${20*s}" fill="${IV("c3")}"/><circle cx="${cx+24*s}" cy="${yb-56*s}" r="${20*s}" fill="${IV("c3")}"/>`},
  bench(x,yb,w=100){return `<rect x="${x}" y="${yb-24}" width="${w}" height="7" rx="2" fill="${IV("wood")}"/><rect x="${x}" y="${yb-46}" width="${w}" height="6" rx="2" fill="${IV("wood")}"/><rect x="${x}" y="${yb-37}" width="${w}" height="6" rx="2" fill="${IV("wood")}"/>
    <line x1="${x+8}" y1="${yb-46}" x2="${x+8}" y2="${yb}" stroke="${IV("boxs")}" stroke-width="3"/><line x1="${x+w-8}" y1="${yb-46}" x2="${x+w-8}" y2="${yb}" stroke="${IV("boxs")}" stroke-width="3"/>`},
  cone(cx,yb,s=1){return `<polygon points="${cx-9*s},${yb-4*s} ${cx+9*s},${yb-4*s} ${cx+3*s},${yb-34*s} ${cx-3*s},${yb-34*s}" fill="${IV("c2")}"/><rect x="${cx-6*s}" y="${yb-22*s}" width="${12*s}" height="${5*s}" fill="${IV("card")}"/><rect x="${cx-13*s}" y="${yb-5*s}" width="${26*s}" height="${5*s}" rx="1" fill="${IV("c2")}"/>`},
  win(x,y,w,h,open=false){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${IV("sky")}" stroke="${IV("metal")}" stroke-width="3"/>
    ${open?`<polygon points="${x+w/2},${y} ${x+w/2+w*0.42},${y+h*0.12} ${x+w/2+w*0.42},${y+h*0.88} ${x+w/2},${y+h}" fill="${IV("glass")}" stroke="${IV("metal")}" stroke-width="2.5" opacity=".9"/>
      <path d="M${x-4},${y-4} Q${x+18},${y+h*0.4} ${x-10},${y+h+6}" fill="none" stroke="${IV("c1")}" stroke-width="10" opacity=".7"/>`
      :`<line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="${IV("metal")}" stroke-width="3"/>`}
    <rect x="${x-6}" y="${y+h}" width="${w+12}" height="6" fill="${IV("card")}" stroke="${IV("metal")}"/>`},
  frame(x,y,w,h,i=0){const c=["c1","c3","c2"][i%3];return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${IV("card")}" stroke="${IV("wood")}" stroke-width="4"/>
    <polygon points="${x+4},${y+h-4} ${x+w*0.4},${y+h*0.4} ${x+w*0.65},${y+h*0.7} ${x+w*0.8},${y+h*0.55} ${x+w-4},${y+h-4}" fill="${IV(c)}"/><circle cx="${x+w*0.75}" cy="${y+h*0.28}" r="${Math.min(w,h)*0.1}" fill="${IV("c2")}" opacity=".7"/>`},
  clock(cx,cy,r=14){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${IV("card")}" stroke="${IV("metal")}" stroke-width="3"/><path d="M${cx} ${cy} L${cx} ${cy-r*0.6} M${cx} ${cy} L${cx+r*0.45} ${cy+r*0.2}" stroke="${IV("dark")}" stroke-width="2"/>`},
  door(x,y,w,h){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${IV("wood")}" stroke="${IV("boxs")}" stroke-width="2"/><rect x="${x+8}" y="${y+10}" width="${w-16}" height="${h*0.35}" fill="none" stroke="${IV("boxs")}" stroke-width="1.5"/><circle cx="${x+w-10}" cy="${y+h*0.55}" r="3" fill="${IV("dark")}"/>`},
  bike(x,yb,rot=0){return `<g stroke="${IV("dark")}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${rot} ${x} ${yb})">
    <circle cx="${x}" cy="${yb-22}" r="22"/><circle cx="${x+74}" cy="${yb-22}" r="22"/>
    <path d="M${x} ${yb-22} L${x+24} ${yb-54} L${x+56} ${yb-54} L${x+74} ${yb-22} M${x+24} ${yb-54} L${x+34} ${yb-22} L${x+56} ${yb-54} M${x+34} ${yb-22} L${x} ${yb-22}"/>
    <path d="M${x+56} ${yb-54} L${x+62} ${yb-72} L${x+76} ${yb-74}"/><path d="M${x+24} ${yb-54} L${x+21} ${yb-62} M${x+13} ${yb-63} L${x+30} ${yb-63}"/></g>`},
  cart(x,yb){return `<rect x="${x}" y="${yb-16}" width="110" height="7" fill="${IV("metal")}"/><path d="M${x+110} ${yb-12} L${x+118} ${yb-70}" stroke="${IV("metal")}" stroke-width="4"/><path d="M${x+112} ${yb-70} L${x+128} ${yb-70}" stroke="${IV("metal")}" stroke-width="4"/>
    <circle cx="${x+14}" cy="${yb-6}" r="6" fill="${IV("deep")}"/><circle cx="${x+96}" cy="${yb-6}" r="6" fill="${IV("deep")}"/>`},
  coat(cx,y,c){return `<path d="M${cx},${y} L${cx-16},${y+10} L${cx-20},${y+62} L${cx+20},${y+62} L${cx+16},${y+10} Z" fill="${IV(c)}" stroke="${IV("dark")}" stroke-width="1"/><path d="M${cx},${y} L${cx},${y+62}" stroke="${IV("dark")}" stroke-width="1" opacity=".5"/>`},
  laptop(x,yb,open=true){return open?`<polygon points="${x+6},${yb-6} ${x+14},${yb-50} ${x+70},${yb-50} ${x+62},${yb-6}" fill="${IV("dark")}"/><polygon points="${x+12},${yb-11} ${x+19},${yb-45} ${x+65},${yb-45} ${x+58},${yb-11}" fill="${IV("glass")}"/><rect x="${x-4}" y="${yb-7}" width="80" height="7" rx="2" fill="${IV("metal")}"/>`
    :`<rect x="${x-4}" y="${yb-8}" width="80" height="8" rx="2" fill="${IV("metal")}"/>`},
  paper(x,yb,n=3){let s="";for(let i=0;i<n;i++)s+=`<rect x="${x+i*3}" y="${yb-3-i*2}" width="34" height="3" fill="${IV("card")}" stroke="${IV("line")}"/>`;return s},

    });

}

  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.connect(g).connect(BG.gain);o.start(t);o.stop(t+0.2);
}
/* 最初の曲（ホーム）の鳴らし方: 最初の版と同じ音色・和音の積み方 */
const ORIG_CH={C:[[60,64,67],36],Am:[[57,60,64],45],F:[[57,60,65],41],G:[[55,59,62],43],Em:[[55,59,64],40],Dm:[[57,62,65],38]};
function bgmScheduleOrig(T,i,t){
  const bar=i>>3,pos=i&7,mel=T.bars[bar],names=T.ch.split("|")[bar].trim().split(/\s+/),st=T.step;
  const c=ORIG_CH[names[names.length>1&&pos>=4?1:0]];
  // メロディ（マリンバ風: 基音＋4倍音を短く）
  const n=mel[pos];
  if(n>0){let len=1;while(pos+len<8&&mel[pos+len]===-1)len++;
    const d=len*st;bgmOsc(mf(n),t,"sine",0.20,Math.max(d*0.9,0.5));bgmOsc(mf(n)*4,t,"sine",0.025,0.08)}
  // コード（1拍目・2拍目の裏・4拍目）
  if(pos===0||pos===3||pos===6)c[0].forEach(m=>bgmOsc(mf(m),t,"triangle",0.045,Math.max(st*1.6,0.35)));
  // ベース
  if(pos===0||pos===4)bgmOsc(mf(c[1]),t,"sine",0.20,Math.max(st*1.8,0.3));
  if(pos===7)bgmOsc(mf(c[1]+12),t,"sine",0.08,0.15);
  // シェイカー（裏拍）
  if(pos&1)bgmNoise(t,pos===3||pos===7?0.03:0.018,0.05,"highpass",7000);
}
function bgmSchedule(T,i,t){
  if(T.style==="orig")return bgmScheduleOrig(T,i,t);
  const bar=i>>3,pos=i&7,mel=T.bars[bar],cs=T.chords[bar],c=cs[cs.length>1&&pos>=4?1:0],st=T.step;
  if(!BG.lp){BG.lp=AC.createBiquadFilter();BG.lp.type="lowpass";BG.lp.frequency.value=2600;BG.lp.connect(BG.gain)}
  // メロディ
  const n=mel[pos];
  if(n>0){let len=1;while(pos+len<8&&mel[pos+len]===-1)len++;
    const d=Math.min(len*st*0.92,0.9);
    if(T.lead==="square"){bgmOsc(mf(n),t,"square",0.07,d,BG.lp);bgmOsc(mf(n)*2,t,"sine",0.04,Math.min(d,0.2))}
    else{bgmOsc(mf(n),t,"triangle",0.16,d);bgmOsc(mf(n)*2,t,"sine",0.03,Math.min(d,0.15))}}
  // コード（裏拍に短く刻む）
  if(pos&1)c.tri.forEach(m=>bgmOsc(mf(m),t,"triangle",0.035,st*0.7));
  // ベース
  if(T.bass==="drive")bgmOsc(mf(c.bass+(pos&1?12:0)),t,"triangle",0.22,st*0.8);
  else if(pos%2===0)bgmOsc(mf(c.bass+(pos===2||pos===6?12:0)),t,"triangle",0.22,st*1.6);
  // ドラム: キック（1・3拍）、スネア（2・4拍）、ハイハット（8分）
  if(pos===0||pos===4||(T.bass==="drive"&&pos===5))bgmKick(t);
  if(pos===2||pos===6)bgmNoise(t,0.12,0.12,"bandpass",1800);
  bgmNoise(t,pos&1?0.035:0.02,pos&1?0.06:0.03,"highpass",7500);
}
function bgmEnsure(){

    AC=AC||new (window.AudioContext||window.webkitAudioContext)();

/* 画面ごとの曲の指定 */

  const want=S.bgm!==false&&!QUIZ&&!document.hidden;
  const now=AC.currentTime,speaking=window.speechSynthesis&&speechSynthesis.speaking;
  const change=BG.on&&BG.tr!==BGM_SCENE;  // 曲が変わるときは、いったん小さくしてから切り替える

/* ---- トレーニングの1問ごとの制限時間 ----
   音声のある問題は、最初の読み上げが終わってから数え始める（読み上げ中は数えない）。
   聞き直しても止まらない。時間切れは不正解（書き取りは、そこまでに入力した分で採点） */
const QT_ANS={q:10,p:20,a:10,i:10};  // 読み上げ後に答える時間（秒）
function qtLimit(it){
  const x=it.x;
  if(it.k==="g")return x.a?20:45;                         // 会話を聞いた後に図を読む / 図と文を読む
  if(it.k==="d")return 15+2*x[1].split(/\s+/).length;      // 入力する語数に応じて
  return QT_ANS[it.k];
}
const hasAudio=it=>it.k==="a"||it.k==="i"||it.k==="d"||(it.k==="g"&&!!it.x.a);
/* 読み上げの長さの見積もり（読み上げの終わりが検出できない端末向けの保険） */
function audioEst(it){
  const x=it.x,txt=it.k==="a"?[x[1],x[2],...x[3]]:it.k==="i"?x[4]:it.k==="d"?[x[1]]:[...x.a.map(l=>l[1]),x.q];
  const gaps=it.k==="a"?1300+3*1450:it.k==="i"?4*1450:it.k==="g"?x.a.length*700:0;
  return txt.join(" ").length/12*1000+gaps;
}
let QTID=0;
function qtSetup(){

}
function qtGo(id){

}

function qtAudioDone(){if(R&&R.qt&&!R.qt.st)qtGo(R.qt.id)}

function qtTimeout(){

/* 回答後の「復習リストに入れる」 */
function missBox(kind,key){
  return `<label class="chk"><input type="checkbox" id="sv" ${S.miss[kind][key]?"checked":""}>復習リストに入れる</label>`;
}
function bindMiss(kind,key){

  c.onchange=()=>{if(c.checked){if(!S.miss[kind][key])S.miss[kind][key]={w:0,c:0}}else delete S.miss[kind][key];save()};

/* 記録: 間違えたら復習リストへ。復習で正解したらリストから外す。
   トレーニング・復習での正解はクリア扱い（実力判定は測るだけなのでクリアにしない） */
/* v: 1＝○、0.5＝△（書き取りの1語違い）、0＝×。true/false も受け付ける */
function record(kind,key,v){
  if(R.mode==="test"||R.mode==="mock")clockPause();  // 解説を見ている間は時間を止める
  v=+v;R.res.push(v);
  const ok=v===1;
  if(R.mode==="mock")return;  // 模擬判定は何も記録しない
  const m=S.miss[kind];
  if(R.mode==="surv"||R.mode==="speed"){  // お楽しみ: クリアにも復習リストにも記録しない（回答後のチェックで手動で入れることはできる）
    if(R.mode==="speed"){if(ok){R.top=Math.max(R.top,R.rate);if(R.rate>=SP_MAX-1e-9)R.maxOk++}else R.maxOk=0}  // maxOk: 最大速度での連続正解数
    if(!ok)R.life--;
    const top=document.querySelector(".top");if(top)top.lastElementChild.outerHTML=dots();  // ライフ表示を更新
    save();return;
  }
  if(ok){
    if(R.mode!=="test")S.done[kind][key]=1;
    if(m[key]){if(R.mode==="review")delete m[key];else m[key].c++}
  }else{
    if(m[key])m[key].w++;else m[key]={w:1,c:0};
    delete m[key].g;  // 最後に間違えた場所（ゲーム名）。ゲーム以外で間違えたら消す
  }
  save();
}

/* ---- 単語クイズ ---- */
const LBL={syn:"似た意味の語は？",ant:"反対の意味の語は？",mean:"意味は？"};
/* 4択で誤答に使うと、もう一つの正解になってしまう語（問題ごと） */
const NG={
  increase:["decline"],accept:["reject","deny"],departure:["出発時刻"],
  sufficient:["plentiful"],scarce:["adequate"],retain:["lose","abandon"],inventory:["在庫目録"],
  comply:["stick"],adhere:["conform"],deteriorate:["declining"],vague:["concrete"],hesitate:["hesitant"],
  alleviate:["lessen"],expedient:["beneficial"],concise:["compact"],adverse:["harmful"],mitigate:["aggravate"],
  cursory:["halfhearted"],perfunctory:["superficial"],transparent:["obscure"],ephemeral:["persistent"],
  fluctuate:["steady"],acquire:["gather"],consistent:["vary"],obsolete:["active"],
  meager:["excessive"],frivolous:["mature"]
};
/* 4択の選択肢:
   半分の確率で「正解＋対の誤答＋別の問題の対（2語）」＝関連した組が2組
   残りは「正解＋別々の問題から1語ずつ」＝関連した組なし
   → 関連した2語の組から正解を推測できないようにする */
function fourOpts(q){
  const isMean=q[2]==="mean";
  const others=shuffle(Q.filter(x=>x!==q&&x[0]===q[0]&&(x[2]==="mean")===isMean));
  const opt=(x,k)=>({w:x[k],j:isMean?"":(k===3?x[6]:x[7]),c:false});
  const bad=new Set([q[1],q[3],q[4],...(NG[q[1]]||[])]);
  const badJa=new Set(isMean?[]:[q[5],q[6],q[7]]);
  const okOpt=o=>!bad.has(o.w)&&!(o.j&&badJa.has(o.j));
  const correct={w:q[3],j:isMean?"":q[6],c:true};
  if(Math.random()<0.5){
    const base=[correct,opt(q,4)];
    for(const x of others){
      const a=opt(x,3),b=opt(x,4);
      if(okOpt(a)&&okOpt(b)&&a.w!==b.w){base.push(a,b);return base}
    }
  }
  const out=[correct];
  for(const x of others){
    const o=opt(x,Math.random()<0.5?3:4);
    if(okOpt(o)&&!out.some(p=>p.w===o.w))out.push(o);
    if(out.length===4)break;
  }
  return out;
}
function qShow(q){
  const key=keyOf(q);
  const o=shuffle(fourOpts(q));
  app.innerHTML=`${topBar()}
  <div class="prompt" style="margin-top:16px">${head()}${LBL[q[2]]}</div>

  <div style="text-align:center;margin-bottom:16px"><button class="play" id="say" aria-label="発音を聞く">▶</button></div>
  <div class="opts${o.length>2?" four":""}">${o.map((x,k)=>`<button class="opt" data-k="${k}">${x.w}</button>`).join("")}</div>

  $("bk").onclick=quit;
  $("say").onclick=()=>speak(q[1]);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>qAns(b,o,q,key));R.onTO=()=>qAns(null,o,q,key);
  speak(q[1]);
}

/* ---- 書き取り ---- */
function speak(t,slow){
  if(!window.speechSynthesis)return;
  const s=speechSynthesis;SEQ++;s.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";u.rate=slow?0.7:0.95;
  const v=s.getVoices().find(x=>x.lang==="en-US");
  if(v)u.voice=v;
  u.onend=qtAudioDone;
  s.speak(u);
}
/* 続けて読み上げる。1文ごとに読み終わりを待ち、指定の間を空けて次へ。
   問いかけと選択肢で声を変える（端末に英語の声が2つ以上ある場合） */
let SEQ=0;
const FEMALE_V=/samantha|karen|moira|tessa|victoria|allison|ava|susan|zoe|fiona|serena|kate|nicky|catherine|martha|veena|joelle|female|woman|zira|hazel|libby|sonia|jenny|aria/i;
const MALE_V=/daniel|alex|fred|tom|aaron|arthur|gordon|oliver|rishi|evan|nathan|lee|reed|ralph|male|man\b|david|mark|george|guy|ryan|thomas/i;
function stopSpeech(){SEQ++;if(window.speechSynthesis)speechSynthesis.cancel()}
function speakSeq(list,rate){
  if(!window.speechSynthesis)return;
  const s=speechSynthesis,id=++SEQ;s.cancel();
  const en=s.getVoices().filter(x=>/^en[-_]/i.test(x.lang));
  const v1=en.find(x=>/^en[-_]US/i.test(x.lang))||en[0];
  const v2=en.find(x=>/^en[-_](GB|AU)/i.test(x.lang))||en.find(x=>x!==v1)||v1;
  // 会話の女性（"W"）・男性（"M"）は、声の名前から性別を見分けて選ぶ。見分けられないときは高さで区別
  const vf=en.find(x=>FEMALE_V.test(x.name)),vm=en.find(x=>MALE_V.test(x.name)&&!FEMALE_V.test(x.name));
  const VV={W:vf||v1,M:vm||v2},known=!!(vf&&vm);
  const step=i=>{
    if(id!==SEQ)return;
    if(i>=list.length){qtAudioDone();return}

/* 数字→英単語（書き取りで数字入力を許可するため） */
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const ORD={one:"first",two:"second",three:"third",five:"fifth",eight:"eighth",nine:"ninth",twelve:"twelfth"};
function numWords(n){
  if(n<20)return [ONES[n]];
  const t=TENS[Math.floor(n/10)],o=n%10;
  return o?[t,ONES[o]]:[t];
}
function ordWords(n){
  const w=numWords(n),l=w[w.length-1];
  w[w.length-1]=ORD[l]||(l.endsWith("y")?l.slice(0,-1)+"ieth":l+"th");
  return w;
}
/* 採点用の正規化。語ごとに小文字化・記号除去・数字→英語・短縮形の展開を行い、
   各トークンが元の何語目から来たか（s）を持たせる（色分け表示のため） */
const NOAPOS={dont:"don't",doesnt:"doesn't",didnt:"didn't",isnt:"isn't",arent:"aren't",wasnt:"wasn't",werent:"weren't",
  havent:"haven't",hasnt:"hasn't",hadnt:"hadn't",couldnt:"couldn't",wouldnt:"wouldn't",shouldnt:"shouldn't",mustnt:"mustn't",
  cant:"can't",wont:"won't",im:"i'm",ive:"i've",youre:"you're",youve:"you've",youll:"you'll",theyre:"they're",theyve:"they've",
  theyll:"they'll",weve:"we've",thats:"that's",whats:"what's",theres:"there's"};
const PRON=/^(i|you|we|they|he|she|it|that|there|here|what|who|where|how)$/;
/* 短縮形は展開して比べる（don't = do not、I'll = I will、cannot = can not）。
   'd（would/had）と 's（is/has）は、代名詞の後のときだけ分けて、どちらの意味でも一致とする */
function expand(t){
  t=NOAPOS[t]||t;
  if(t==="cannot")return ["can","not"];
  if(t==="let's")return ["let","us"];
  let m=t.match(/^(\w+)n't$/);
  if(m)return [({ca:"can",wo:"will",sha:"shall"})[m[1]]||m[1],"not"];
  m=t.match(/^(\w+)'(re|ve|ll|m)$/);
  if(m)return [m[1],{re:"are",ve:"have",ll:"will",m:"am"}[m[2]]];
  m=t.match(/^(\w+)'(d|s)$/);
  if(m&&PRON.test(m[1]))return [m[1],"'"+m[2]];
  return [t];
}
const ALT={"'d":/^('d|would|had)$/,"'s":/^('s|is|has)$/};
const eqTok=(x,y)=>x===y||(ALT[x]&&ALT[x].test(y))||(ALT[y]&&ALT[y].test(x));
function normWord(w){
  w=w.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/(\d+):00/g,"$1").replace(/%/g," percent");
  return w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/)
    .map(t=>t.replace(/^'+|'+$/g,"")).filter(Boolean).flatMap(t=>{
      const m=t.match(/^(\d+)(st|nd|rd|th)$/);
      if(m&&+m[1]<100)return ordWords(+m[1]);
      if(/^\d+$/.test(t)&&+t<100)return numWords(+t);
      return expand(t);
    });
}
function toks(str){
  const words=str.trim().split(/\s+/).filter(Boolean),out=[];
  words.forEach((w,i)=>normWord(w).forEach(t=>out.push({t,s:i})));
  return {words,out};
}
function match(a,b){
  const n=a.length,m=b.length,T=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=eqTok(a[i],b[j])?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(eqTok(a[i],b[j])){hit[i]=true;i++;j++}else if(T[i+1][j]>=T[i][j+1])i++;else j++}
  return hit;
}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* 書き取りの採点: 全語一致＝○(1点)、1語だけ違う（抜け・余分・誤り）＝△(0.5点)、それ以外＝×(0点) */
/* 書き取りの採点。v: 1＝全部正しい、0.5＝1語違い、0＝2語以上違い。html: 正解文（語ごとに色分け）、mine: 入力文 */
function dGrade(ref,input){
  const A1=toks(ref),U=toks(input);
  const a=A1.out.map(x=>x.t),b=U.out.map(x=>x.t);
  const hit=match(a,b),hitB=match(b,a);
  // 元の語単位で数える（It's→Its のように1語の誤りが2トークンに分かれても1語違いとする）
  const wordOk=(T,hits)=>T.words.map((_,i)=>T.out.every((x,j)=>x.s!==i||hits[j]));
  const rOk=wordOk(A1,hit),uOk=wordOk(U,hitB);
  const errs=Math.max(rOk.filter(x=>!x).length,uOk.filter(x=>!x).length),v=errs===0?1:errs===1?0.5:0;
  const html=A1.words.map((w,k)=>`<span class="${rOk[k]?"w-ok":"w-ng"}">${w}</span>`).join(" ");
  const mine=U.words.length?U.words.map((w,k)=>`<span class="${uOk[k]?"w-ok":"w-ng"}">${esc(w)}</span>`).join(" "):"（未入力）";
  return {v,html,mine};
}
function dAns(d,key){

const FM=[["q","単語"],["p","穴埋め"],["a","応答"],["g","図表"],["i","写真"],["d","書取"]];
/* 実力判定の出題数と、形式ごとの満点（現行 r:4） */
const TEST_N={q:2,p:2,a:2,g:1,i:1,d:1};
const FMAX={q:5,p:5,a:5,g:2.5,i:2.5,d:5};
/* 判定ルール: Lv L になる条件は
   ・合計が TH[L-1] 点以上
   ・Lv L の問題で MIN 点以上（当てずっぽうの期待値を超える＝そのレベルが解けている）
   を両方満たすこと。満たすうち一番上のレベルが判定。
   r:3 = 35問・20点満点（過去の記録の表示用）/ r:4 = 45問・25点満点（現行） */
const RULE={3:{TH:[7,9,11,13,15],MIN:2,lvMax:4,tot:20},4:{TH:[9,11,14,16,19],MIN:2.5,lvMax:5,tot:25}};
const TH=RULE[4].TH,LVMIN=RULE[4].MIN;
const sum1=a=>Math.round(a.reduce((x,y)=>x+y,0)*10)/10;
const judgeTotal=(sc,r=4)=>{const R_=RULE[r],tot=sum1(sc);let l=0;R_.TH.forEach((x,i)=>{if(tot>=x&&sc[i]>=R_.MIN)l=i+1});return l};
function judgeWhyTotal(sc,lv,r=4,conv){
  const R_=RULE[r],tot=sum1(sc),head=conv?`${R_.tot}点満点に換算して${fmtN(tot)}点`:`${R_.tot}点中${fmtN(tot)}点`;
  if(lv>=5)return head;
  const need=[];
  if(tot<R_.TH[lv])need.push(`合計あと${fmtN(R_.TH[lv]-tot)}点`);
  if(sc[lv]<R_.MIN)need.push(`Lv${lv+1}の問題で${fmtN(R_.MIN)}点以上（今回${conv?"換算":""}${fmtN(sc[lv])}点）`);
  return `${head}。Lv${lv+1}には${need.join("と、")}が必要`;
}
/* 旧ルール（r:2・過去の記録の表示用）: 合格（4点中3点以上）したうち一番上のレベル。
   ただし、それより下の不合格レベルが1つまでのときだけ数える */
const PASS=3;
function judgeLv(sc){
  for(let L=5;L>=1;L--){
    if(sc[L-1]<PASS)continue;
    if(sc.slice(0,L-1).filter(c=>c<PASS).length<=1)return L;
  }
  return 0;
}
/* 判定の理由を短い文で返す */
function judgeWhy(sc,lv){
  const f=x=>fmtN(x)+"/4点",out=[];
  const below=sc.slice(0,Math.max(lv-1,0)).map((c,i)=>[i+1,c]).filter(([,c])=>c<PASS);
  if(below.length)out.push(`Lv${below[0][0]}は${f(below[0][1])}で未達（1つまでは許容）`);
  if(lv<5){
    if(lv===0&&!sc.some(c=>c>=PASS))out.push("どのレベルも3点に届きませんでした");
    else if(sc[lv]<PASS)out.push(`Lv${lv+1}が${f(sc[lv])}で未達`);
    const blocked=sc.map((c,i)=>[i+1,c]).filter(([L,c])=>L>lv&&c>=PASS);
    if(blocked.length)out.push(`Lv${blocked.map(b=>b[0]).join("・")}は合格点ですが、下で2つ以上未達のため数えません`);
  }
  return out.length?out.join("。"):"全レベル合格";
}
/* 判定結果の共通部分（総合評価・菱形・表）。t = {lv, sc, fm?, g?}

/* 形式ごとの得点をレーダーで描く。上から時計回りに FM の順（記録にある形式だけ。旧記録は4軸＝菱形）。
   各軸は満点で正規化（外周＝満点） */
function radar(fm,fmax){
  const cx=160,cy=132,r=86,ks=FM.filter(([k])=>k in fm),n=ks.length;
  const ax=ks.map(([k,l],i)=>{const th=2*Math.PI*i/n;return [k,l==="書取"?"書き取り":l,Math.sin(th),-Math.cos(th)]});
  const rd=v=>Math.round(v*10)/10;
  const pt=(f,dx,dy)=>`${rd(cx+dx*r*f)},${rd(cy+dy*r*f)}`;
  const ring=f=>ax.map(a=>pt(f,a[2],a[3])).join(" ");
  const grid=[.2,.4,.6,.8,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")
    +ax.map(a=>`<line x1="${cx}" y1="${cy}" x2="${rd(cx+a[2]*r)}" y2="${rd(cy+a[3]*r)}" stroke="var(--line)" stroke-width="1"/>`).join("");
  const fr=a=>Math.min(1,fm[a[0]]/fmax(a[0]));
  const shape=ax.map(a=>pt(fr(a),a[2],a[3])).join(" ");
  const dots=ax.map(a=>{const [x,y]=pt(fr(a),a[2],a[3]).split(",");
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>`}).join("");
  const labels=ax.map(a=>{
    const side=Math.abs(a[2])>.1?Math.sign(a[2]):0;
    const x=rd(cx+a[2]*(r+12)),yb=cy+a[3]*(r+12);
    // 上端は2行を上に、下端は下に、横は中央揃え
    const y=rd(a[3]<-.9?yb-22:a[3]>.9?yb+12:yb+a[3]*10-4);
    const anc=side===1?"start":side===-1?"end":"middle";
    return `<text x="${x}" y="${y}" text-anchor="${anc}" font-size="13" fill="var(--sub)">${a[1]}</text>
      <text x="${x}" y="${rd(y+17)}" text-anchor="${anc}" font-size="15" font-weight="700" fill="var(--ink)">${fmtN(fm[a[0]])}<tspan font-size="11" font-weight="400" fill="var(--sub)">/${fmtN(fmax(a[0]))}</tspan></text>`}).join("");
  return `<svg viewBox="0 0 320 290" width="100%" style="max-width:340px;display:block;margin:4px auto 0" role="img"
    aria-label="形式ごとの得点：${ax.map(a=>a[1]+" "+fmtN(fm[a[0]])+"/"+fmtN(fmax(a[0]))).join("、")}">
    ${grid}<polygon points="${shape}" fill="var(--acc)" fill-opacity=".22" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
/* 判定の推移（直近14回） */
function graph(){
  const t=S.tests.slice(-14);
  if(!t.length)return "";
  const bars=t.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
    <div style="font-size:11px;color:var(--sub)">${x.lv||"-"}</div>
    <div style="width:100%;max-width:22px;height:${Math.max(x.lv,0.15)/5*90}px;background:var(--acc);border-radius:4px 4px 0 0;opacity:${x.lv?1:.3}"></div>
    <div style="font-size:10px;color:var(--sub)">${dayLabel(x.day)}</div></div>`).join("");
  return `<div class="card"><b>判定の推移</b><div style="display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px">${bars}</div></div>`;
}

function records(){bgmScene("home");

  let cells="";
  ["日","月","火","水","木","金","土"].forEach(w=>cells+=`<div style="font-size:11px;color:var(--sub)">${w}</div>`);
  for(let i=0;i<first.getDay();i++)cells+="<div></div>";
  for(let d=1;d<=days;d++){

    cells+=`<div ${tl?`class="calday" data-day="${di}" role="button"`:""} style="position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;
      ${on?"background:var(--acc);color:#fff;font-weight:700;":""}${di===today&&!on?"border:1.5px solid var(--acc);":""}">${d}${tl?`<span class="calv">${tl.lv||"-"}</span>`:""}</div>`;

  </div>

    <div class="ja" style="margin-top:10px">塗りつぶし：練習した日　右上の数字：実力判定の結果（Lv）。数字の付いた日をタップすると、その日の結果が見られます</div></div>
  ${graph()||'<div class="card"><b>判定の推移</b><div class="ja">まだ判定を受けていません</div></div>'}`;

let CVS=null;
const cvById=id=>CV.find(c=>c.id===id);
/* レベル順（同じレベルは追加順）に並べたもの。一覧と「次の会話」に使う */
const CV_ORD=[...CV].sort((a,b)=>a.lv-b.lv||CV.indexOf(a)-CV.indexOf(b));
function cvRows(){
  const B=S.best.cv||{},rec=Math.min(best()+1,5);
  return CV_ORD.map(c=>`<button class="srow stg" data-cv="${c.id}"><span style="flex:1">Lv${c.lv}　${c.t}${c.lv===rec?' <span class="tag">おすすめ</span>':""}</span>
    <span class="sub">${B[c.id]?`ベスト ${fmtN(B[c.id])}点`:"—"}</span></button>`).join("");
}
function cvStart(id){QUIZ=true;
  const c=cvById(id);
  CVS={c,i:0,d:[],q:[],qi:0};

}
const cvPlayAll=c=>speakSeq(c.L.map(([w,t])=>[t,700,w]));
function cvListen(){
  const c=CVS.c;
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ やめる</button></div>

    <div class="sub" style="margin-top:6px">全${c.L.length}文。このあと1文ずつ書き取り、最後に内容についての質問（英語）に${c.Q.length}問答えます。</div></div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:14px"><button class="play" id="say" aria-label="会話を聞く">▶</button><span class="sub">会話を聞く（何度でも）</span></div>
  <button class="btn" id="go" style="margin-top:18px">書き取りへ進む</button>`;

function cvLine(){
  const c=CVS.c,[w,t,j]=c.L[CVS.i];

  <div class="row" style="margin-top:10px"><button class="btn" id="pl">▶ 再生</button><button class="btn ghost" id="sl">ゆっくり</button></div>
  <textarea class="ans" id="in" rows="3" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力"></textarea>

function cvCheck(){
  if(CVS.d.length>CVS.i)return;
  const [w,t,j]=CVS.c.L[CVS.i],g=dGrade(t,$("in").value);

  <button class="btn" id="nx">${last?"内容の質問へ":"次の文へ"}</button>`;
  $("nx").onclick=()=>{stopSpeech();CVS.i++;last?cvQ():cvLine()};
}
function cvQ(){
  const c=CVS.c,q=c.Q[CVS.qi],L="ABCD";
  const o=shuffle(q.o.map((w,k)=>({w,c:k===q.c})));

  <div style="display:flex;gap:12px;align-items:center;margin:12px 0"><button class="play" id="say" aria-label="会話を聞く">▶</button><span class="sub">会話をもう一度聞く</span></div>
  <div class="opts" style="gap:10px">${o.map((t,k)=>`<button class="opt" style="text-align:left;padding:14px;font-size:17px" data-k="${k}"><b>${L[k]}</b>　${esc(t.w)}</button>`).join("")}</div>

  $("bk").onclick=()=>{stopSpeech();games(G_LAST)};

    if(CVS.q.length>CVS.qi)return;
    stopSpeech();
    const ok=o[+b.dataset.k].c;ok?SFX.ok():SFX.ng();
    CVS.q.push(ok?1:0);markOpts(o,b);
    const last=CVS.qi>=c.Q.length-1;
    $("after").innerHTML=`<div class="card" style="font-size:15px;line-height:1.6"><div class="ja" style="margin-top:0">質問：${q.qj}</div><div style="margin-top:6px">${q.ex}</div></div>
    <button class="btn" id="nx">${last?"結果を見る":"次の質問へ"}</button>`;
    $("nx").onclick=()=>{CVS.qi++;last?cvEnd():cvQ()};
  });
  speakSeq([[q.q,0,0]]);

/* 点数: 書き取り（○1点・△0.5点）＋ 質問（1問2点） */
function cvEnd(){bgmScene("fun");
  const c=CVS.c,ds=CVS.d.reduce((a,g)=>a+g.v,0),qs=CVS.q.reduce((a,b)=>a+b,0),score=ds+qs*2,max=c.L.length+c.Q.length*2;
  S.stamps[dayIdx()]=1;S.best.cv=S.best.cv||{};
  const prev=S.best.cv[c.id]||0,isBest=score>prev;if(isBest)S.best.cv[c.id]=score;save();

  ${isBest?`<div class="lvmsg">自己ベスト更新${prev?`（前回まで ${fmtN(prev)}点）`:""}</div>`:`<div class="ja" style="text-align:center">自己ベスト：${fmtN(prev)}点</div>`}
  <div class="card list"><b>会話の全文</b>${c.L.map(([w,t,j],k)=>`<div>${markOf(CVS.d[k].v)} <span class="tag">${w==="W"?"女性":"男性"}</span> ${esc(t)}<div class="ja">${j}</div></div>`).join("")}</div>

  <button class="btn" id="again">もう一度</button>
  ${next?`<button class="btn ghost" id="nxc">次の会話（Lv${next.lv}）</button>`:""}
  <button class="btn ghost" id="hm">ホームへ</button>`;

/* サバイバル: ライフ3。単語・穴埋め・応答から出題。SV_STEP問正解ごとにレベル+1（最大5） */
const SV_LIFE=3,SV_STEP=10;
const svLv=ok=>Math.min(5,1+Math.floor(ok/SV_STEP));
function svAdd(){
  const lv=svLv(R.res.filter(v=>v===1).length);
  const k=["q","p","a"][Math.floor(Math.random()*3)];
  const pool=SRC[k].filter(x=>x[0]===lv&&!R.used.has(x));
  const x=(pool.length?shuffle(pool):shuffle(SRC[k].filter(x=>x[0]===lv)))[0];
  R.used.add(x);R.items.push({k,x});
}
function svStart(){
  R={mode:"surv",items:[],i:0,res:[],det:[],lock:false,life:SV_LIFE,used:new Set()};
  svAdd();show();
}
function svResult(){
  stopSpeech();
  S.stamps[dayIdx()]=1;
  const ok=R.res.filter(v=>v===1).length,prev=S.best.sv||0,isBest=ok>prev;
  if(isBest)S.best.sv=ok;
  save();
  const wrong=resultList(v=>v!==1);
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 戻る</button></div>
  <div class="prompt">サバイバル</div>
  <div class="score">${ok}問</div>
  <div class="sub" style="text-align:center">Lv${svLv(ok)}まで到達　・　${R.res.length}問中${ok}問正解</div>
  ${isBest?`<div class="lvmsg">自己ベスト更新${prev?`（前回まで ${prev}問）`:""}</div>`:`<div class="ja" style="text-align:center">自己ベスト：${prev}問</div>`}
  <div class="card list"><b>間違えた問題</b>${wrong}</div>
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" id="hm">ホームへ</button>`;
  $("bk").onclick=()=>games(G_LAST);$("hm").onclick=home;$("again").onclick=svStart;
}

/* タイムアタック: 60秒。正解+1問、不正解は残り時間-2秒。単語（意味・類義語・対義語）の4択 */
const TA_SEC=60,TA_PEN=2;
let TA=null;
function taStart(lv){bgmScene("rush");
  TA={lv,pool:shuffle(Q.filter(x=>x[0]===lv)),n:0,ok:0,miss:[],end:performance.now()+TA_SEC*1000,timer:null,lock:false};
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ やめる</button><b id="tac" style="font-size:18px">0問</b></div>
  <div class="tbar"><i id="tbi"></i></div>
  <div id="tsec" class="sub" style="text-align:right;margin-top:4px"></div>
  <div id="taq"></div>`;
  $("bk").onclick=()=>{taStop();games(G_LAST)};
  TA.timer=setInterval(taTick,100);
  taTick();taQ();
}
function taStop(){if(TA&&TA.timer){clearInterval(TA.timer);TA.timer=null}}
function taTick(){
  if(!$("tbi")){taStop();return}  // 画面を離れていたら止める
  const left=Math.max(0,TA.end-performance.now());
  $("tbi").style.width=(left/(TA_SEC*1000)*100)+"%";
  $("tbi").style.background=left<10000?"var(--ng)":"var(--acc)";
  $("tsec").textContent=Math.ceil(left/1000)+"秒";
  if(left<=0){taStop();taFinish()}
}
function taQ(){
  if(!TA.pool.length)TA.pool=shuffle(Q.filter(x=>x[0]===TA.lv));
  const q=TA.pool.pop(),o=shuffle(fourOpts(q));TA.cur=q;TA.lock=false;
  $("taq").innerHTML=`<div class="prompt" style="margin-top:14px">${LBL[q[2]]}</div>
  <div class="word">${q[1]}</div>
  <div id="pen" class="lvmsg" style="color:var(--ng);height:22px"></div>
  <div class="opts four">${o.map((x,k)=>`<button class="opt" data-k="${k}">${x.w}</button>`).join("")}</div>`;
  app.querySelectorAll("#taq .opt").forEach(b=>b.onclick=()=>{
    if(TA.lock||!TA.timer)return;TA.lock=true;
    const ok=o[+b.dataset.k].c;TA.n++;
    markOpts(o,b);
    if(ok){SFX.ok();TA.ok++;$("tac").textContent=TA.ok+"問";setTimeout(()=>TA.timer&&taQ(),250)}
    else{
      SFX.ng();TA.end-=TA_PEN*1000;$("pen").textContent=`−${TA_PEN}秒　正解：${q[3]}`;
      TA.miss.push(q);
      setTimeout(()=>TA.timer&&taQ(),900);
    }
  });
}
function taFinish(){bgmScene("fun");
  S.stamps[dayIdx()]=1;
  S.best.ta=S.best.ta||{};
  const prev=S.best.ta[TA.lv]||0,isBest=TA.ok>prev;
  if(isBest)S.best.ta[TA.lv]=TA.ok;
  save();
  const miss=TA.miss.filter((x,i,a)=>a.indexOf(x)===i);
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 戻る</button></div>
  <div class="prompt">タイムアタック　Lv${TA.lv}</div>
  <div class="score">${TA.ok}問</div>
  <div class="sub" style="text-align:center">${TA.n}問中${TA.ok}問正解</div>
  ${isBest?`<div class="lvmsg">自己ベスト更新${prev?`（前回まで ${prev}問）`:""}</div>`:`<div class="ja" style="text-align:center">自己ベスト：${prev}問</div>`}
  ${miss.length?`<div class="card list"><b>間違えた単語</b>${miss.map(q=>`<div><b>${q[1]}</b> ${q[5]}<div class="ja">${({syn:"似た意味",ant:"反対の意味",mean:"意味"})[q[2]]}の正解：${q[3]}${q[2]==="mean"?"":`（${q[6]}）`}</div></div>`).join("")}</div>`:""}
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" id="hm">ホームへ</button>`;
  const lv=TA.lv;
  $("bk").onclick=()=>games(G_LAST);$("hm").onclick=home;$("again").onclick=()=>taStart(lv);
}

/* 早口チャレンジ: 応答問題を音声のみで。正解ごとに読み上げ速度+0.1倍（最大2.0倍）、ライフ3 */
// 1.0倍→最大1.8倍を10段階（0.08倍ずつ）。最大速度で SP_CLEAR 問続けて正解したらクリア
const SP_START=1.0,SP_MAX=1.8,SP_STEP=(1.8-1.0)/10,SP_CLEAR=2;
const fmtRate=r=>r.toFixed(2).replace(/0$/,"")+"倍";
function spAdd(){
  const pool=A.filter(x=>x[0]===R.lv&&!R.used.has(x));
  const x=(pool.length?shuffle(pool):shuffle(A.filter(x=>x[0]===R.lv)))[0];
  R.used.add(x);R.items.push({k:"a",x});
}
function spStart(lv){
  R={mode:"speed",lv,items:[],i:0,res:[],det:[],lock:false,life:SV_LIFE,used:new Set(),rate:SP_START,top:0,maxOk:0};
  spAdd();show();
}
function spResult(){
  stopSpeech();
  S.stamps[dayIdx()]=1;
  S.best.sp=S.best.sp||{};
  const ok=R.res.filter(v=>v===1).length,prev=S.best.sp[R.lv]||0,isBest=R.top>prev+1e-9;
  const clear=R.maxOk>=SP_CLEAR;
  if(isBest)S.best.sp[R.lv]=R.top;
  S.best.spc=S.best.spc||{};if(clear)S.best.spc[R.lv]=1;
  save();
  const lv=R.lv;
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 戻る</button></div>
  <div class="prompt">早口チャレンジ　Lv${lv}</div>
  ${clear?`<div class="lvmsg" style="font-size:20px;font-weight:700">クリア！</div>`:""}
  <div class="score">${R.top?fmtRate(R.top):"—"}</div>
  <div class="sub" style="text-align:center">正解できた一番速い速さ　・　${R.res.length}問中${ok}問正解</div>
  ${isBest?`<div class="lvmsg">自己ベスト更新${prev?`（前回まで ${fmtRate(prev)}）`:""}</div>`:`<div class="ja" style="text-align:center">自己ベスト：${prev?fmtRate(prev):"—"}</div>`}
  <div class="card list"><b>間違えた問題</b>${resultList(v=>v!==1)}</div>
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" id="hm">ホームへ</button>`;
  $("bk").onclick=()=>games(G_LAST);$("hm").onclick=home;$("again").onclick=()=>spStart(lv);
}

/* 1語だけ書き取り: 例文を読み上げ、1語を空欄にして入力。1回 OW_N 問。点数＝連続正解数（コンボ）の合計 */
const OW_N=10;
const OW_STOP=new Set("the a an and or but of to in on at for by with from this that these those will would should could have has had been be is are was were your our their its his her you we they them what when where which who how about into than then there here some any all each other more most such very just also only".split(" "));
// 空欄にできる語: 英字のみ4文字以上、機能語と固有名詞（文中の大文字）を除く
const owCands=t=>t.split(" ").map((w,i)=>({w:w.replace(/[.,!?;:]+$/,""),i})).filter(({w,i})=>/^[A-Za-z]+$/.test(w)&&w.length>=4&&!OW_STOP.has(w.toLowerCase())&&!(i>0&&/^[A-Z]/.test(w)));
let OW=null;
function owStart(lv){QUIZ=true;
  OW={lv,items:shuffle(D.filter(x=>x[0]===lv)).slice(0,OW_N).map(d=>({d,b:shuffle(owCands(d[1]))[0]})),i:0,combo:0,maxCombo:0,score:0,res:[]};

}
function owShow(){
  const it=OW.items[OW.i],words=it.d[1].split(" ");
  const shown=words.map((w,i)=>i===it.b.i?`<span class="blank"></span>${esc(w.slice(it.b.w.length))}`:esc(w)).join(" ");

    <div style="display:flex;gap:12px;align-items:center"><span class="sub">${OW.i+1} / ${OW_N}</span><b>${OW.score}点</b>${OW.combo>1?`<span class="tag">${OW.combo}コンボ</span>`:""}</div></div>
  <div class="prompt" style="margin-top:14px"><span class="tag">Lv${OW.lv}</span> 空欄の1語を入力</div>

function owCheck(){

  $("after").innerHTML=`<div class="card"><div>${ok?`<b class="w-ok">○ 正解</b>${OW.combo>1?`　${OW.combo}コンボ（+${OW.combo}点）`:"（+1点）"}`

function owFinish(){bgmScene("fun");

  <div class="card list"><b>今回の文</b>${OW.res.map(r=>`<div>${r.ok?'<span class="w-ok">○</span>':'<span class="w-ng">×</span>'}
    ${r.it.d[1].split(" ").map((w,i)=>i===r.it.b.i?`<b>${esc(w)}</b>`:esc(w)).join(" ")}
    ${r.ok?"":`<div class="ja">あなたの入力：${r.typed?esc(r.typed):"（未入力）"}</div>`}</div>`).join("")}</div>
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" id="hm">ホームへ</button>`;
  $("bk").onclick=()=>games(G_LAST);$("hm").onclick=home;$("again").onclick=()=>owStart(lv);

/* 神経衰弱: 「単語の意味」の問題から MM_N 組（英単語⇔和訳）。記録＝そろえるまでのタイム（ペナルティなし） */
const MM_N=6;
let MM=null;
function mmStart(lv){bgmScene("fun");
  // 和訳が重ならない6語を選ぶ
  const pick=[],ja=new Set();
  for(const q of shuffle(Q.filter(x=>x[0]===lv&&x[2]==="mean"))){if(!ja.has(q[3])){pick.push(q);ja.add(q[3])}if(pick.length===MM_N)break}
  const cards=shuffle(pick.flatMap((q,i)=>[{p:i,t:q[1],en:true,q},{p:i,t:q[3],en:false,q}]));
  MM={lv,cards,open:[],got:0,miss:0,flips:0,t0:null,el:0,timer:null,lock:false,missed:new Set()};
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ やめる</button>
    <div style="display:flex;gap:12px;align-items:center"><span class="sub" id="mmg">0 / ${MM_N}組</span><b id="mmt">0.0秒</b></div></div>
  <div class="prompt" style="margin-top:10px"><span class="tag">Lv${lv}</span> 英単語と和訳のペアをそろえる</div>
  <div class="mmgrid">${cards.map((c,i)=>`<button class="mmc" data-i="${i}"><span>${esc(c.t)}</span></button>`).join("")}</div>
  <div id="mmmsg" class="lvmsg" style="min-height:22px"></div>`;
  $("bk").onclick=()=>{mmStop();stopSpeech();games(G_LAST)};
  app.querySelectorAll(".mmc").forEach(b=>b.onclick=()=>mmFlip(+b.dataset.i,b));
}
function mmStop(){if(MM&&MM.timer){clearInterval(MM.timer);MM.timer=null}}
const mmEl=()=>MM.el+(MM.t0===null?0:performance.now()-MM.t0);
function mmFlip(i,b){
  const c=MM.cards[i];
  if(MM.lock||c.done||MM.open.includes(i))return;
  if(MM.t0===null&&!MM.got&&!MM.flips){MM.t0=performance.now();MM.timer=setInterval(()=>{const e=$("mmt");if(e)e.textContent=fmtSec(mmEl())},100)}
  MM.flips++;b.classList.add("up");SFX.tap();
  if(c.en)speak(c.t);
  MM.open.push(i);
  if(MM.open.length<2)return;
  const [a,bb]=MM.open.map(k=>MM.cards[k]),els=MM.open.map(k=>app.querySelector(`.mmc[data-i="${k}"]`));
  if(a.p===bb.p){
    a.done=bb.done=true;MM.got++;MM.open=[];SFX.ok();
    els.forEach(e=>e.classList.add("done"));
    $("mmg").textContent=`${MM.got} / ${MM_N}組`;
    $("mmmsg").innerHTML=`<span class="w-ok">${esc(a.q[1])}：${esc(a.q[3])}</span>`;
    if(MM.got===MM_N){MM.el=mmEl();MM.t0=null;mmStop();setTimeout(mmFinish,700)}
    return;
  }
  // 英単語と和訳の組み合わせを間違えたときだけミスに数える（英同士・和訳同士は位置の探り合いなので数えない）
  if(a.en!==bb.en){
    MM.miss++;SFX.ng();
    const en=a.en?a:bb;MM.missed.add(en.q);  // 結果画面で×を付けるだけ。神経衰弱のミスは復習リストに入れない
    $("mmmsg").innerHTML=`<span style="color:var(--ng)">ちがいます</span>`;
    els.forEach(e=>e.classList.add("ng"));
  }else $("mmmsg").textContent="";
  MM.lock=true;
  setTimeout(()=>{els.forEach(e=>e.classList.remove("up","ng"));MM.open=[];MM.lock=false},900);
}
function mmFinish(){
  const total=MM.el,lv=MM.lv;
  S.stamps[dayIdx()]=1;
  S.best.mm=S.best.mm||{};
  const prev=S.best.mm[lv],isBest=!prev||total<prev;
  if(isBest)S.best.mm[lv]=total;
  save();
  const pairs=MM.cards.filter(c=>c.en).map(c=>c.q);
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 戻る</button></div>
  <div class="prompt">神経衰弱　Lv${lv}</div>
  <div class="score">${fmtSec(total)}</div>
  <div class="sub" style="text-align:center">ミス${MM.miss}回　・　${MM.flips}回めくり</div>
  ${isBest?`<div class="lvmsg">自己ベスト更新${prev?`（前回まで ${fmtSec(prev)}）`:""}</div>`:`<div class="ja" style="text-align:center">自己ベスト：${fmtSec(prev)}</div>`}
  <div class="card list"><b>今回の単語</b>${pairs.map(q=>`<div>${MM.missed.has(q)?'<span class="w-ng">×</span>':'<span class="w-ok">○</span>'} <b>${q[1]}</b>　${q[3]}</div>`).join("")}</div>
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" id="hm">ホームへ</button>`;
  $("bk").onclick=()=>games(G_LAST);$("hm").onclick=home;$("again").onclick=()=>mmStart(lv);
}

/* 語順パズル: 書き取りの例文を単語に分けて並べ替える。1回5文、タイム＋ミス1回5秒 */
const WO_N=5,WO_PEN=5,WO_MAX=3;
const fmtSec=x=>(x/1000).toFixed(1)+"秒";
let WO=null;
/* 語順パズルの別解（例文 → 正解にする別の語順。句読点なし・小文字で比較）
   理由・時・条件などを表す部分を文頭／文末に移した、自然な語順だけを登録 */
const WO_ALT={
  "Our new branch office will open in the spring.":["in the spring our new branch office will open"],
  "Please make sure to turn off the lights when you leave.":["when you leave please make sure to turn off the lights"],
  "Let me know if you have any questions about the proposal.":["if you have any questions about the proposal let me know"],
  "Please call me back when you have a moment.":["when you have a moment please call me back"],
  "The train was delayed because of the heavy snow.":["because of the heavy snow the train was delayed"],
  "Please submit your expense report by the end of the month.":["by the end of the month please submit your expense report"],
  "Refreshments will be served in the lobby after the presentation.":["after the presentation refreshments will be served in the lobby"],
  "Our flight has been canceled due to bad weather.":["due to bad weather our flight has been canceled"],
  "Sales have increased steadily since the campaign began.":["since the campaign began sales have increased steadily"],
  "The package should have arrived by now.":["by now the package should have arrived"],
  "Due to heavy traffic, the delivery may be slightly delayed.":["the delivery may be slightly delayed due to heavy traffic"],
  "The factory has been operating at full capacity since April.":["since april the factory has been operating at full capacity"],
  "Unless otherwise noted, all prices include tax.":["all prices include tax unless otherwise noted"],
  "Despite rising costs, the firm managed to maintain its profit margins.":["the firm managed to maintain its profit margins despite rising costs"],
  "Production was temporarily halted while the equipment was inspected.":["while the equipment was inspected production was temporarily halted"],
  "Notwithstanding the setbacks, the product launch proceeded as planned.":["the product launch proceeded as planned notwithstanding the setbacks"],
  "Given the current economic climate, expansion plans have been put on hold.":["expansion plans have been put on hold given the current economic climate"]
};
// 並べ替え用の語: 句読点を外し、文頭の大文字は小文字にする（I / I'm などは除く）。比較は小文字で
function woWords(t){
  return t.split(" ").map((w,i)=>{
    w=w.replace(/[.,!?;:]+$/,"");
    if(i===0&&!/^I('|$)/.test(w))w=w[0].toLowerCase()+w.slice(1);
    return w;
  });
}
function woStart(lv){bgmScene("fun");
  WO={lv,items:shuffle(D.filter(x=>x[0]===lv)).slice(0,WO_N),i:0,miss:0,fail:[],el:0,t0:null,timer:null,log:[]};
  WO.timer=setInterval(()=>{const e=$("wot");if(e)e.textContent=fmtSec(woEl())},100);
  woShow();
}
function woStop(){if(WO&&WO.timer){clearInterval(WO.timer);WO.timer=null}}
/* 経過時間（1問解き終わるごとに止め、次の問題で再開） */
const woEl=()=>WO.el+(WO.t0===null?0:performance.now()-WO.t0);
function woPause(){if(WO.t0!==null){WO.el+=performance.now()-WO.t0;WO.t0=null}}
function woShow(){
  const d=WO.items[WO.i],words=woWords(d[1]);
  let pool;do{pool=shuffle(words.map((w,k)=>({w,k})))}while(words.length>1&&pool.every((p,i)=>p.w===words[i]));
  WO.cur={d,words,pool,ans:[],tries:0,done:false,wrongs:[]};
  WO.log[WO.i]=WO.cur;
  WO.t0=performance.now();
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ やめる</button>
    <div style="display:flex;gap:12px;align-items:center"><span class="sub">${WO.i+1} / ${WO_N}</span><b id="wot">${fmtSec(woEl())}</b></div></div>
  <div class="prompt" style="margin-top:14px"><span class="tag">Lv${WO.lv}</span> 和訳に合うように並べ替え</div>
  <div class="card" style="font-size:17px;line-height:1.6;margin-top:10px">${d[2]}</div>
  <div id="woa" class="woarea"></div>
  <div id="wop" class="woarea pool"></div>
  <div id="wom" class="lvmsg" style="min-height:22px"></div>
  <div id="after"></div>`;
  $("bk").onclick=()=>{woStop();stopSpeech();games(G_LAST)};
  woDraw();
}
function woDraw(bad){
  const c=WO.cur;
  $("woa").innerHTML=c.ans.length?c.ans.map((p,i)=>`<button class="chip${bad!==undefined&&i>=bad?" ng":""}${c.done?" ok":""}" data-i="${i}">${esc(p.w)}</button>`).join(""):'<span class="sub">ここに単語が並びます</span>';
  $("wop").innerHTML=c.pool.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p.w)}</button>`).join("");
  if(c.done)return;
  $("woa").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{c.pool.push(...c.ans.splice(+b.dataset.i,1));$("wom").textContent="";woDraw()});
  $("wop").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    c.ans.push(...c.pool.splice(+b.dataset.i,1));SFX.tap();
    if(!c.pool.length)woCheck();else woDraw();
  });
}
function woCheck(){
  const c=WO.cur,got=c.ans.map(p=>p.w.toLowerCase());
  // 例文の語順と別解のうち、一番先まで一致するものと比べる（赤くする位置もそれに合わせる）
  const cands=[c.words.map(w=>w.toLowerCase()),...(WO_ALT[c.d[1]]||[]).map(a=>a.split(" "))];
  const bads=cands.map(want=>got.findIndex((w,i)=>w!==want[i]));
  const bad=bads.includes(-1)?-1:Math.max(...bads);
  if(bad<0){
    woPause();SFX.ok();c.done=true;woDraw();
    $("wom").innerHTML=`<span class="w-ok">正解</span>${bads[0]!==-1?`<div class="ja">例文の語順：${c.d[1]}</div>`:""}`;
    speak(c.d[1]);woNext();return;
  }
  SFX.ng();c.tries++;WO.miss++;
  c.wrongs.push({w:c.ans.map(p=>p.w),bad});  // 結果画面で見せるため、間違えた並べ方を残す
  if(c.tries>=WO_MAX){
    woPause();
    // 3回間違えたら正解を表示して次へ（この文は失敗として復習リストへ）
    c.done=true;WO.fail.push(c.d);  // 失敗として結果に残すだけ（復習リストには入れない）
    c.ans=c.words.map(w=>({w}));c.pool=[];woDraw();
    $("wom").innerHTML=`<span style="color:var(--ng)">${WO_MAX}回ミス。正解の語順です</span>`;
    speak(c.d[1]);woNext();return;
  }
  woDraw(bad);
  $("wom").innerHTML=`<span style="color:var(--ng)">赤い単語から後ろが違います（＋${WO_PEN}秒）。タップで外して並べ直してください</span>`;
}
function woNext(){
  $("after").innerHTML=`<div style="text-align:center;margin-top:6px"><button class="play" id="say" aria-label="文を聞く">▶</button></div>
  <button class="btn" id="nx">${WO.i<WO_N-1?"次へ":"結果を見る"}</button>`;
  $("say").onclick=()=>speak(WO.cur.d[1]);
  $("nx").onclick=()=>{stopSpeech();WO.i++;WO.i<WO_N?woShow():woFinish()};
}
function woFinish(){
  woStop();
  const raw=woEl(),total=raw+WO.miss*WO_PEN*1000;
  S.stamps[dayIdx()]=1;
  S.best.wo=S.best.wo||{};
  // 5文すべて自力で正解したときだけ自己ベストの対象にする
  const eligible=!WO.fail.length,prev=S.best.wo[WO.lv],isBest=eligible&&(!prev||total<prev);
  if(isBest)S.best.wo[WO.lv]=total;
  save();
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 戻る</button></div>
  <div class="prompt">語順パズル　Lv${WO.lv}</div>
  <div class="score">${fmtSec(total)}</div>
  <div class="sub" style="text-align:center">解答時間 ${fmtSec(raw)}　＋　ミス${WO.miss}回×${WO_PEN}秒</div>
  ${isBest?`<div class="lvmsg">自己ベスト更新${prev?`（前回まで ${fmtSec(prev)}）`:""}</div>`
    :`<div class="ja" style="text-align:center">${eligible?"":"正解を表示した文があるため、自己ベストの対象外です。"}自己ベスト：${prev?fmtSec(prev):"—"}</div>`}
  <div class="card list"><b>今回の文</b>${WO.log.map(c=>{
    const d=c.d,fail=WO.fail.includes(d);
    const tries=c.wrongs.map((t,n)=>`<div class="ja" style="margin-top:4px">ミス${n+1}：${t.w.map((w,i)=>i>=t.bad?`<span class="w-ng">${esc(w)}</span>`:esc(w)).join(" ")}</div>`).join("");
    return `<div>${fail?'<span class="w-ng">×</span>':'<span class="w-ok">○</span>'} ${d[1]}${c.wrongs.length&&!fail?`<span class="sub">（ミス${c.wrongs.length}回）</span>`:""}
      <div class="ja">${d[2]}</div>${tries}</div>`}).join("")}</div>
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" id="hm">ホームへ</button>`;
  const lv=WO.lv;
  $("bk").onclick=()=>games(G_LAST);$("hm").onclick=home;$("again").onclick=()=>woStart(lv);
}

/* ---- 辞書 ----
   見出し: DICT（意味・用法を書いたもの）＋ 単語クイズの語と選択肢（和訳だけ）
   関連問題: 活用形（-s/-ed/-ing など）も含めて、全形式の問題文から探す */
const DPOS={"動":"動詞","名":"名詞","形":"形容詞","副":"副詞","前":"前置詞","接":"接続詞","句":"熟語・決まった形"};
let DIDX=null;
function dictIndex(){
  if(DIDX)return DIDX;
  const m=new Map();
  DICT.forEach(e=>m.set(e[0].toLowerCase(),{w:e[0],p:e[1],m:e[2],u:e[3],n:e[4],full:true}));
  const add=(w,ja)=>{const k=w.toLowerCase();if(!m.has(k)&&ja)m.set(k,{w,m:ja,full:false})};
  Q.forEach(q=>{if(q[2]==="mean")add(q[1],q[5]);else{add(q[1],q[5]);add(q[3],q[6]);add(q[4],q[7])}});
  DIDX=[...m.values()];
  return DIDX;
}
// 見出し語 → 問題文を探す正規表現（活用形・熟語の間に入る語に対応）
const IRR={fall:"fall|falls|fell|fallen|falling",take:"take|takes|took|taken|taking",run:"run|runs|ran|running",be:"be|is|are|was|were|been|being|am",have:"have|has|had|having",put:"put|puts|putting",go:"go|goes|went|gone|going",bring:"bring|brings|brought|bringing",buy:"buy|buys|bought|buying",lend:"lend|lends|lent|lending",sell:"sell|sells|sold|selling",begin:"begin|begins|began|begun|beginning"};
function forms(w){
  if(IRR[w])return IRR[w];
  const e=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),f=[e,e+"s",e+"es",e+"ed",e+"d",e+"ing",e+"er",e+"ers",e+"ly"];
  if(/y$/.test(w))f.push(e.slice(0,-1)+"ies",e.slice(0,-1)+"ied");
  if(/e$/.test(w))f.push(e.slice(0,-1)+"ing");
  if(/[^aeiou][aeiou][bdgmnprt]$/.test(w))f.push(e+w.slice(-1)+"ed",e+w.slice(-1)+"ing");
  return f.join("|");
}
function wordRe(w){
  const parts=w.toLowerCase().split(" ");
  if(parts.length===1)return new RegExp(`\\b(${forms(parts[0])})\\b`,"i");
  // 熟語: A/B は任意の語、1語目は活用あり。2語の句動詞（call back など）は間に3語まで入ってよい
  const gap=parts.length===2?"(?:\\s+\\S+){0,3}\\s+":"\\s+";
  const body=parts.map((p,i)=>/^[AB]$/i.test(p)&&i>0?"\\S+(?:\\s+\\S+)*?":i===0?`(?:${forms(p)})`:p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join(parts.length===2?gap:"\\s+");
  return new RegExp(`\\b${body}\\b`,"i");
}
// 問題を検索用の文に。表示用の要約も持たせる
let PIDX=null;
function probIndex(){
  if(PIDX)return PIDX;
  PIDX=[
    ...Q.map(q=>({k:"q",x:q,t:[q[1],q[3],q[4]].join(" | ")})),
    ...P.map(x=>({k:"p",x,t:x[1].replace("___",x[2])+" | "+x[3].join(" | ")+" | "+x[4]})),  // 解説（look into など）も対象
    ...A.map(x=>({k:"a",x,t:[x[1],x[2],...x[3]].join(" | ")})),
    ...D.map(x=>({k:"d",x,t:x[1]})),
    ...I.map(x=>({k:"i",x,t:x[4].join(" | ")})),
    ...G.map(x=>({k:"g",x,t:[x.g.t,...x.g.h,...x.g.r.flat(),x.g.n||"",...(x.a||[]).map(l=>l[1]),x.tx?x.tx[0]:"",x.q,...x.o].join(" | ")}))
  ];
  return PIDX;
}
const KNAME={q:"単語",p:"穴埋め",a:"応答",d:"書き取り",g:"図表",i:"写真描写"};
function probsFor(re){return probIndex().filter(o=>re.test(o.t))}
function probView(o,re){
  const x=o.x,hl=t=>esc(t).replace(new RegExp(re.source,"gi"),m=>`<b class="hl">${m}</b>`);
  let main,sub;
  if(o.k==="q"){main=`${hl(x[1])}　<span class="sub">${LBL[x[2]].replace("？","")}</span>`;sub=`正解：${hl(x[3])}${x[2]==="mean"?"":`（${x[6]}）`}　誤答：${hl(x[4])}${x[2]==="mean"?"":`（${x[7]}）`}　／　${x[1]}：${x[5]}`}
  else if(o.k==="p"){main=hl(x[1].replace("___",x[2]));sub=`${x[5]}<br>選択肢：${[x[2],...x[3]].map(hl).join(" / ")}<br>${x[4]}`}
  else if(o.k==="a"){main=hl(x[1]);sub=`${x[4]}<br>→ ${hl(x[2])}（${x[5]}）<br>誤答：${x[3].map(hl).join(" / ")}`}
  else if(o.k==="i"){main=hl(x[4][x[6]]);sub=`<div style="max-width:260px">${ISVG(x[2],x[3]())}</div>${x[4].map((t,k)=>`<div>${"ABCD"[k]}. ${hl(t)}${k===x[6]?"（正解）":""}</div>`).join("")}`}
  else if(o.k==="g"){main=hl(x.q);sub=`${gTable(x.g)}${x.a?x.a.map(l=>`<div>${l[0]==="W"?"女性":"男性"}：${hl(l[1])}</div>`).join(""):`<div>${hl(x.tx[0])}</div>`}<div style="margin-top:4px">正解：${hl(x.o[x.c])}</div>`}
  else{main=hl(x[1]);sub=x[2]}
  return `<details class="prob"><summary><span class="tag">${KNAME[o.k]} Lv${x[0]}</span> ${main}</summary><div class="ja" style="line-height:1.7">${sub}</div></details>`;
}
function dictSearch(q){
  stopSpeech();
  q=q||"";
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ ホーム</button></div>
  <h1>辞書</h1>
  <input class="ans" id="dq" style="min-height:0;height:52px;margin-top:12px" placeholder="英語か日本語で検索（例：comply、延期）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(q).replace(/"/g,"&quot;")}">
  <div id="dres"></div>`;
  $("bk").onclick=home;
  const run=()=>{
    const v=$("dq").value.trim(),lv=v.toLowerCase();
    if(!v){$("dres").innerHTML=`<div class="note">収録：${DICT.length}語・熟語${dictIndex().some(e=>!e.full)?`（うち和訳のみ ${dictIndex().filter(e=>!e.full).length}語）`:""}。見出しの語は、その語が出てくる問題も確認できます。見出しにない語は「問題文から探す」で検索できます。</div>`;return}
    const ix=dictIndex(),isJa=/[^\x00-\x7f]/.test(v);
    const hit=ix.map(e=>{const w=e.w.toLowerCase();let sc=-1;
      if(isJa){if(e.m.includes(v))sc=e.full?2:1}
      else if(w===lv)sc=5;else if(w.startsWith(lv))sc=4;else if(w.split(" ").some(p=>p.startsWith(lv)))sc=3;else if(lv.length>=3&&w.includes(lv))sc=2;
      return {e,sc}}).filter(o=>o.sc>=0).sort((a,b)=>b.sc-a.sc||(b.e.full-a.e.full)||a.e.w.localeCompare(b.e.w)).slice(0,40);
    const rows=hit.map(({e})=>`<button class="srow stg dw" data-w="${esc(e.w)}"><span style="flex:1"><b>${esc(e.w)}</b>　<span class="sub">${esc(e.m)}</span></span>${e.full?"":'<span class="sub" style="font-size:11px">和訳のみ</span>'}</button>`).join("");
    const free=isJa?"":`<button class="srow stg" id="dfree"><span style="flex:1">問題文から「${esc(v)}」を探す</span><span class="sub">›</span></button>`;
    $("dres").innerHTML=`<div class="card">${rows||'<div class="ja">見出しが見つかりません</div>'}${free}</div>`;
    $("dres").querySelectorAll(".dw").forEach(b=>b.onclick=()=>dictEntry(b.dataset.w,v));
    if($("dfree"))$("dfree").onclick=()=>dictFree(v);
  };
  $("dq").oninput=run;
  $("dq").onkeydown=e=>{if(e.key==="Enter"){const f=$("dres").querySelector(".dw");if(f)f.click()}};
  run();
}
function dictEntry(w,back){
  const e=dictIndex().find(x=>x.w.toLowerCase()===w.toLowerCase())||{w,m:"",full:false};
  const re=wordRe(e.w),probs=probsFor(re);
  const groups=["q","p","a","d","g","i"].map(k=>{const l=probs.filter(o=>o.k===k);return l.length?`<div class="card"><b>${KNAME[k]}（${l.length}）</b>${l.map(o=>probView(o,re)).join("")}</div>`:""}).join("");
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 検索</button></div>
  <div style="display:flex;align-items:center;gap:12px;margin-top:8px"><h1 style="flex:1;margin:0;word-break:break-word">${esc(e.w)}</h1>
    <button class="play" id="say" aria-label="発音を聞く">▶</button></div>
  ${e.p?`<div class="sub">${e.p.split("・").map(x=>DPOS[x]||x).join("・")}</div>`:""}
  <div class="card">
    <div style="font-size:18px;line-height:1.6">${esc(e.m||"（意味は未収録）")}</div>
    ${e.u?`<div class="dsec">よく使う形</div>${e.u.split("；").map(x=>`<div class="dline">${esc(x)}</div>`).join("")}`:""}
    ${e.n?`<div class="dsec">メモ</div><div class="dline">${esc(e.n)}</div>`:""}
    ${e.full?"":'<div class="ja" style="margin-top:8px">この語は、単語クイズの和訳だけを表示しています。</div>'}
  </div>
  <div class="dsec" style="margin-top:18px">この語が出てくる問題　${probs.length}問</div>
  ${groups||'<div class="card"><div class="ja">この語が出てくる問題はありません</div></div>'}`;
  $("bk").onclick=()=>dictSearch(back||"");
  $("say").onclick=()=>speak(e.w.replace(/\b[AB]\b/g,""));
  speak(e.w.replace(/\b[AB]\b/g,""));
}
function dictFree(v){
  const re=new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),probs=probsFor(re);
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ 検索</button></div>
  <h1>「${esc(v)}」を含む問題</h1><div class="sub">${probs.length}問</div>
  ${["q","p","a","d","g","i"].map(k=>{const l=probs.filter(o=>o.k===k);return l.length?`<div class="card"><b>${KNAME[k]}（${l.length}）</b>${l.map(o=>probView(o,re)).join("")}</div>`:""}).join("")||'<div class="card"><div class="ja">見つかりません</div></div>'}`;
  $("bk").onclick=()=>dictSearch(v);
}

/* ---- 復習リスト ---- */
function missList(){bgmScene("home");
  const rows=kind=>SRC[kind].filter(x=>S.miss[kind][x[1]]).map(x=>{
    const r=S.miss[kind][x[1]];
    const main=kind==="q"?`<b>${x[1]}</b>　${x[5]}`
      :kind==="p"?`${esc(x[1]).replace("___","<b>"+x[2]+"</b>")}<div class="ja">${x[5]}</div>`
      :kind==="a"?`${esc(x[1])}<div class="ja">${x[4]}</div>`
      :kind==="i"?`${esc(x[4][x[6]])}<div class="ja">${x[5][x[6]]}</div>`
      :kind==="g"?`<span class="sub">${esc(x.g.t)}</span><br>${esc(x.q)}<div class="ja">${x.qj}</div>`
      :`${x[1]}<div class="ja">${x[2]}</div>`;
    return `<div class="srow">
      <div style="flex:1">${main}<div class="ja"><b style="color:var(--ng);font-size:16px">×</b> ${r.w}回${r.g?`　<span class="tag">${r.g}</span>`:""}</div></div>
      <button class="back del" style="font-size:14px;color:var(--ng)" data-k="${kind}" data-key="${x[1].replace(/"/g,"&quot;")}">削除</button>
    </div>`;
  }).join("");
  const n=nMiss(),sec=(k,t)=>{const r=rows(k);return `<div class="card"><b>${t}</b>${r||'<div class="ja">なし</div>'}</div>`};
  app.innerHTML=`<div class="top"><button class="back" id="bk">‹ ホーム</button></div>
  <h1>まとめて復習</h1><div class="sub">間違えた問題と、自分でチェックした問題です。ここで正解するとリストから外れます。1回最大10問</div>
  ${n?'<button class="btn" id="go">復習をはじめる</button>':""}
  ${sec("q","単語")}${sec("p","短文穴埋め")}${sec("a","応答問題")}${sec("d","書き取り")}${sec("g","図表問題")}${sec("i","写真描写")}`;
  $("bk").onclick=home;
  if(n)$("go").onclick=startReview;
  app.querySelectorAll(".del").forEach(b=>b.onclick=()=>{delete S.miss[b.dataset.k][b.dataset.key];save();missList()});
}
